<!DOCTYPE html>
<html>

<head>
  <title>Registration Form</title>
</head>

<body>

  <h2>Student Registration Form</h2>

  <form id="myForm">

    <input type="text" id="first_name" placeholder="First Name"><br><br>
    <input type="text" id="last_name" placeholder="Last Name"><br><br>
    <input type="text" id="phone" placeholder="Phone Number"><br><br>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="text" id="state" placeholder="State"><br><br>
    <input type="text" id="city" placeholder="City"><br><br>
    <input type="text" id="hobby" placeholder="Hobby"><br><br>
    <input type="text" id="subject" placeholder="Subject"><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.getElementById("myForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      message.innerText = "Form submitted successfully!";
    });
  </script>

</body>

</html>
